name: Gerar executável

on:
  push:
    tags: ["v*"]        # ao criar uma tag como v1.0.0, gera o .exe e publica a Release
  workflow_dispatch:    # permite rodar manualmente pela aba Actions

permissions:
  contents: write       # necessário para criar a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt pyinstaller

      - name: Gerar executável
        run: >
          pyinstaller --onefile --windowed
          --name TrocarCores
          --collect-all pikepdf
          trocar_cores_gui.py

      - name: Guardar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TrocarCores
          path: dist/TrocarCores.exe

      - name: Publicar na Release (somente em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrocarCores.exe
